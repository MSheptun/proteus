name: Build AlphaKeys (Android keyboard)

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform and NDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108"
      - name: Build
        run: alphakeys/scripts/build.sh "$RUNNER_TEMP/alphakeys-src"
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaKeys-apk
          path: ${{ runner.temp }}/alphakeys-src/app/build/outputs/apk/release/*.apk
